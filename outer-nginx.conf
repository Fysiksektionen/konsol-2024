# This nginx serves as a reverse proxy (mostly for local debugging /
# documentation) and is ran with the included docker-compose.yml.
# Fysikmotorn has its own nginx instead of this.
#
# Everything the konsol app serves (pages, server functions, JS/WASM,
# stylesheets, slide images) lives under /konsol/, so this one location
# block is the only routing the deployment host needs.
server {
    listen 80 default_server;
    server_name localhost _;

    location /konsol/ {
        proxy_pass http://konsol:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
